[project]
name = "passport-gooyoit"
version = "0.1.0"
description = "Client SDK for Passport Gooyoit SSO (OAuth 2.0 authorization code flow)."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gooyoit" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/gooyoit/Passport-Gooyoit"
Repository = "https://github.com/gooyoit/Passport-Gooyoit"

[project.optional-dependencies]
fastapi = ["fastapi>=0.110.0"]
dev = [
    "pytest>=8.3.0",
    "respx>=0.21.0",
    "fastapi>=0.110.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["passport_gooyoit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
