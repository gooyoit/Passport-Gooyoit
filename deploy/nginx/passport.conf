# Explicitly retire the legacy API domains so they cannot fall through to
# another virtual host that also listens on 8443.
server {
    listen 8443 ssl;
    server_name api.gooyoit.com admin-api.gooyoit.com;

    ssl_certificate /etc/nginx/ssl/gooyoit.com.pem;
    ssl_certificate_key /etc/nginx/ssl/gooyoit.com.key;

    return 410;
}

server {
    listen 80;
    server_name passport.gooyoit.com passport-admin.gooyoit.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name passport.gooyoit.com;

    ssl_certificate /etc/nginx/ssl/gooyoit.com.pem;
    ssl_certificate_key /etc/nginx/ssl/gooyoit.com.key;

    root /data/apps/gooyoit-passport/frontend/current;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth providers generate callback URLs without the frontend /api prefix.
    location ~ ^/(auth|oauth)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}

server {
    listen 443 ssl http2;
    server_name passport-admin.gooyoit.com;

    ssl_certificate /etc/nginx/ssl/gooyoit.com.pem;
    ssl_certificate_key /etc/nginx/ssl/gooyoit.com.key;

    root /data/apps/gooyoit-passport-admin/frontend/current;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
